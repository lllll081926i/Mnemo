# Mnemo Release
# - Trigger: tag v* or manual dispatch
# - Never deletes existing GitHub Releases / assets (upload with --clobber only replaces same filename)
# - Builds Windows (x64+arm64 Inno Setup), macOS (arm64), Linux (x64+arm64) in parallel

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"
  MPV_VERSION: "v0.41.0"
  MPV_SOURCE_SHA256: "ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209"
  MESON_VERSION: "1.3.2"
  LINUXDEPLOY_VERSION: "1-alpha-20251107-1"
  APPIMAGETOOL_VERSION: "1.9.1"
  NFPM_VERSION: "v2.47.0"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      # Avoid GitHub codeload throttling when every native runner downloads
      # checkout/setup actions at exactly the same time.
      max-parallel: 2
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows/amd64
            artifact: Mnemo-windows-x64
            arch: x64
          - name: Windows arm64
            os: windows-latest
            platform: windows/arm64
            artifact: Mnemo-windows-arm64
            arch: arm64
          - name: macOS arm64
            # Keep the runner aligned with the official macOS 14 arm bundle.
            os: macos-14
            platform: darwin/arm64
            artifact: Mnemo-macos-arm64
            arch: arm64
          - name: Linux x64
            # mpv v0.41.0 needs FFmpeg 6; Ubuntu 24.04 also provides WebKitGTK 4.1.
            os: ubuntu-24.04
            platform: linux/amd64
            artifact: Mnemo-linux-x64
            arch: x64
          - name: Linux arm64
            # Build on a native arm64 runner. Installing mpv on an x64
            # runner and copying it into an arm64 package silently produces
            # an unusable player binary.
            os: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: Mnemo-linux-arm64
            arch: arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 10000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [[ "${attempt}" == '3' ]]; then
              echo 'npm ci failed after 3 attempts' >&2
              exit 1
            fi
            sleep_seconds=$((attempt * 15))
            echo "npm ci failed; retrying in ${sleep_seconds}s" >&2
            sleep "${sleep_seconds}"
          done

      # ---------- mpv engine: fixed official release, checked by SHA-256 ----------
      - name: Fetch mpv engine (Windows x64)
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          choco install 7zip -y --no-progress
          export PATH="/c/Program Files/7-Zip:$PATH"
          mkdir -p internal/engine/win32/mpv
          url="https://github.com/mpv-player/mpv/releases/download/${MPV_VERSION}/mpv-${MPV_VERSION}-x86_64-pc-windows-msvc.zip"
          curl -fsSL --retry 5 --retry-all-errors -o mpv.zip "${url}"
          printf '%s  mpv.zip\n' '4e197f729f5071c6772f35fffd96e0f36e3e8a044bd9479b136bb09b7c6a80ff' | sha256sum -c -
          7z x mpv.zip -ompv-extract -y
          mpv_bin="$(find mpv-extract -type f -name 'mpv.exe' -print -quit)"
          test -n "${mpv_bin}"
          cp -a "$(dirname "${mpv_bin}")"/. internal/engine/win32/mpv/
          test -f internal/engine/win32/mpv/mpv.exe

      - name: Fetch mpv engine (Windows arm64)
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          choco install 7zip -y --no-progress
          export PATH="/c/Program Files/7-Zip:$PATH"
          mkdir -p internal/engine/win32/mpv
          url="https://github.com/mpv-player/mpv/releases/download/${MPV_VERSION}/mpv-${MPV_VERSION}-aarch64-pc-windows-msvc.zip"
          curl -fsSL --retry 5 --retry-all-errors -o mpv.zip "${url}"
          printf '%s  mpv.zip\n' 'a822abeffd0ac88951f4084f3425f949842aa17d616f880637ebe9041e482e97' | sha256sum -c -
          7z x mpv.zip -ompv-extract -y
          mpv_bin="$(find mpv-extract -type f -name 'mpv.exe' -print -quit)"
          test -n "${mpv_bin}"
          cp -a "$(dirname "${mpv_bin}")"/. internal/engine/win32/mpv/
          test -f internal/engine/win32/mpv/mpv.exe

      - name: Fetch mpv engine (macOS arm64)
        if: runner.os == 'macOS' && matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          mkdir -p internal/engine/darwin/mpv
          url="https://github.com/mpv-player/mpv/releases/download/${MPV_VERSION}/mpv-${MPV_VERSION}-macos-14-arm.zip"
          curl -fsSL --retry 5 --retry-all-errors -o mpv.zip "${url}"
          printf '%s  mpv.zip\n' '5c96f9b21355fc0a11d2e2161ad65f33031070e9fb3f6bd9865fb459b94587e6' | shasum -a 256 -c -
          rm -rf mpv-extract
          mkdir mpv-extract
          ditto -x -k mpv.zip mpv-extract
          mpv_archive="$(find mpv-extract -type f -name 'mpv.tar.gz' -print -quit)"
          test -n "${mpv_archive}"
          tar -xzf "${mpv_archive}" -C mpv-extract
          mpv_app="$(find mpv-extract -type d -name 'mpv.app' -print -quit)"
          test -n "${mpv_app}"
          ditto "${mpv_app}" internal/engine/darwin/mpv/mpv.app
          test -x internal/engine/darwin/mpv/mpv.app/Contents/MacOS/mpv

      - name: Build mpv engine (Linux, pinned source tag)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ca-certificates curl meson ninja-build pkg-config \
            pax-utils patchelf python3-venv \
            libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev libplacebo-dev libass-dev \
            libx11-dev libxext-dev libxpresent-dev libxrandr-dev libxss-dev \
            libxv-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl-dev libpipewire-0.3-dev \
            libpulse-dev libasound2-dev libva-dev libvulkan-dev
          python3 -m venv --clear /tmp/mnemo-meson-venv
          /tmp/mnemo-meson-venv/bin/python -m pip install \
            --disable-pip-version-check --no-input --retries 5 --timeout 120 \
            "meson==${MESON_VERSION}" "pyelftools==0.31"
          export PATH="/tmp/mnemo-meson-venv/bin:${PATH}"
          test "$(meson --version)" = "${MESON_VERSION}"
          expected_arch="amd64"
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then expected_arch="arm64"; fi
          test "$(dpkg --print-architecture)" = "${expected_arch}"
          rm -rf /tmp/mnemo-mpv-src /tmp/mnemo-mpv-build
          mkdir -p /tmp/mnemo-mpv-src
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/mpv-player/mpv/archive/refs/tags/${MPV_VERSION}.tar.gz" \
            -o /tmp/mnemo-mpv.tar.gz
          printf '%s  /tmp/mnemo-mpv.tar.gz\n' "${MPV_SOURCE_SHA256}" | sha256sum -c -
          tar xzf /tmp/mnemo-mpv.tar.gz --strip-components=1 -C /tmp/mnemo-mpv-src
          meson setup /tmp/mnemo-mpv-build /tmp/mnemo-mpv-src \
            --buildtype=release \
            -Dbuild-date=false \
            -Dcplayer=true -Dlibmpv=false -Dtests=false \
            -Dmanpage-build=disabled -Dhtml-build=disabled -Dpdf-build=disabled \
            -Dlua=disabled -Djavascript=disabled -Dcplugins=disabled \
            -Dlibarchive=disabled -Dlibbluray=disabled -Dvapoursynth=disabled \
            -Duchardet=disabled -Dzimg=disabled -Drubberband=disabled \
            -Ddvbin=disabled -Dcdda=disabled -Ddvdnav=disabled \
            -Djack=disabled -Dopenal=disabled -Dsndio=disabled \
            -Dsdl2-audio=disabled -Dsdl2-video=disabled -Dx11=enabled \
            -Dwayland=enabled -Dpipewire=enabled -Dpulse=enabled -Dalsa=enabled \
            -Dvaapi=enabled -Dvulkan=enabled
          meson compile -C /tmp/mnemo-mpv-build
          mkdir -p internal/engine/linux/mpv/lib
          cp /tmp/mnemo-mpv-build/mpv internal/engine/linux/mpv/mpv
          chmod +x internal/engine/linux/mpv/mpv
          # Embed codec and text-rendering libraries so the bundled player does
          # not drift with the host distribution. Desktop/GPU/audio drivers and
          # glibc stay host-provided for hardware compatibility.
          lddtree -l internal/engine/linux/mpv/mpv | while IFS= read -r dep; do
            case "${dep}" in
              /lib/*|/usr/lib/*)
                base="$(basename "${dep}")"
                case "${base}" in
                  libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|libgcc_s.so*|libstdc++.so*|libresolv.so*|libnss_*.so*|libGL.so*|libEGL.so*|libOpenGL.so*|libGLX.so*|libX*.so*|libxcb*.so*|libwayland*.so*|libdrm.so*|libgbm.so*|libpipewire*.so*|libpulse*.so*|libasound.so*|libva*.so*|libvulkan.so*) ;;
                  *) test -f "${dep}" && cp -L "${dep}" internal/engine/linux/mpv/lib/ ;;
                esac
                ;;
            esac
          done
          patchelf --set-rpath '$ORIGIN/lib' internal/engine/linux/mpv/mpv
          if [[ "${{ matrix.arch }}" == "x64" ]]; then
            file internal/engine/linux/mpv/mpv | grep -Eq 'x86-64|x86_64'
          else
            file internal/engine/linux/mpv/mpv | grep -Eq 'ARM aarch64|AArch64'
          fi
          test -f internal/engine/linux/mpv/mpv
          test -n "$(find internal/engine/linux/mpv/lib -type f -print -quit)"
          readelf -d internal/engine/linux/mpv/mpv | grep -F '$ORIGIN/lib'
          LD_LIBRARY_PATH="${PWD}/internal/engine/linux/mpv/lib" internal/engine/linux/mpv/mpv --version >/dev/null

      # ---------- secrets.json: inject OAuth credentials ----------
      - name: Generate secrets.json
        shell: bash
        env:
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${ONEDRIVE_CLIENT_ID}" || -n "${DROPBOX_APP_KEY}" ]]; then
            node <<'NODE'
          const fs = require('node:fs')
          const secrets = {
            onedrive_client_id: process.env.ONEDRIVE_CLIENT_ID || '',
            dropbox_app_key: process.env.DROPBOX_APP_KEY || '',
          }
          fs.writeFileSync('secrets.json', JSON.stringify(secrets, null, 2) + '\n', { mode: 0o600 })
          NODE
            echo "secrets.json generated"
          else
            echo "no OAuth secrets provided, building without secrets.json"
          fi

      # ---------- build ----------
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          pkg-config --modversion webkit2gtk-4.1

      - name: Build with Wails
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            wails build -platform "${{ matrix.platform }}" -clean -tags webkit2_41
          else
            wails build -platform "${{ matrix.platform }}" -clean
          fi

      # DataDir reads runtime configuration next to the executable. Keep the
      # generated OAuth file in that exact location for every package layout;
      # the repository-root copy is only a CI staging file.
      - name: Install runtime data directory
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Windows)
              runtime_dir="build/bin/data"
              ;;
            macOS)
              runtime_dir="build/bin/mnemo-go.app/Contents/MacOS/data"
              ;;
            Linux)
              runtime_dir="build/bin/data"
              ;;
            *)
              echo "unsupported runner: ${{ runner.os }}" >&2
              exit 1
              ;;
          esac
          mkdir -p "${runtime_dir}"
          if [[ -f secrets.json ]]; then
            cp secrets.json "${runtime_dir}/secrets.json"
            chmod 600 "${runtime_dir}/secrets.json" || true
            echo "runtime OAuth secrets installed at ${runtime_dir}/secrets.json"
          else
            echo "no OAuth secrets to install"
          fi
          test -d "${runtime_dir}"

      - name: Verify bundled mpv is present in the built binary
        shell: bash
        run: |
          set -euo pipefail
          app_bin="build/bin/mnemo-go"
          case "${{ runner.os }}" in
            Windows)
              app_bin="${app_bin}.exe"
              test -f internal/engine/win32/mpv/mpv.exe
              ;;
            macOS)
              app_bin="${app_bin}.app/Contents/MacOS/mnemo-go"
              test -x internal/engine/darwin/mpv/mpv.app/Contents/MacOS/mpv
              ;;
            Linux)
              test -x internal/engine/linux/mpv/mpv
              test -n "$(find internal/engine/linux/mpv/lib -type f -print -quit)"
              ;;
          esac
          test -s "${app_bin}"
          grep -a -q 'mpv' "${app_bin}"

      # ---------- package ----------
      - name: Create Inno Setup installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then
            choco install innosetup -y --no-progress
          fi
          test -f "$ISCC"
          MSYS_NO_PATHCONV=1 "$ISCC" "/DMyArchSuffix=${{ matrix.artifact }}" build/windows/installer.iss

      - name: Rename installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p build/installer
          if [ -f build/installer/MnemoSetup.exe ]; then
            mv build/installer/MnemoSetup.exe "build/installer/${{ matrix.artifact }}-Setup.exe"
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd build/bin
          7z a "../../${{ matrix.artifact }}.zip" *

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          tar czf "../../${{ matrix.artifact }}.tar.gz" *

      - name: Package (Linux — multi-format parallel)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # 1. tar.gz (always)
          (cd build/bin && tar czf "../../${{ matrix.artifact }}.tar.gz" *) &
          # 2. install the pinned nfpm binary for deb + rpm
          nfpm_arch="x86_64"
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then nfpm_arch="arm64"; fi
          nfpm_url="https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/nfpm_${NFPM_VERSION#v}_Linux_${nfpm_arch}.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors "${nfpm_url}" -o /tmp/nfpm.tar.gz
          if [[ "${nfpm_arch}" == "x86_64" ]]; then
            printf '%s  /tmp/nfpm.tar.gz\n' '0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783' | sha256sum -c -
          else
            printf '%s  /tmp/nfpm.tar.gz\n' '1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c' | sha256sum -c -
          fi
          mkdir -p /tmp/nfpm-bin
          tar xzf /tmp/nfpm.tar.gz -C /tmp/nfpm-bin
          nfpm_cmd="/tmp/nfpm-bin/nfpm"
          test -x "${nfpm_cmd}"
          arch="$(dpkg --print-architecture)"
          # nfpm config uses {{.Arch}} placeholder; substitute
          sed "s/{{.Arch}}/${arch}/" build/linux/nfpm.yaml > /tmp/nfpm.yaml
          "${nfpm_cmd}" pkg --packager deb --config /tmp/nfpm.yaml --target "${{ matrix.artifact }}.deb" &
          "${nfpm_cmd}" pkg --packager rpm --config /tmp/nfpm.yaml --target "${{ matrix.artifact }}.rpm" &
          wait
          ls -la "${{ matrix.artifact }}".*

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          arch="x86_64"
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then arch="aarch64"; fi
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/TheAssassin/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-${arch}.AppImage" \
            -o /tmp/linuxdeploy
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${arch}.AppImage" \
            -o /tmp/appimagetool
          if [[ "${arch}" == "x86_64" ]]; then
            printf '%s  /tmp/linuxdeploy\n' 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d' | sha256sum -c -
            printf '%s  /tmp/appimagetool\n' 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0' | sha256sum -c -
          else
            printf '%s  /tmp/linuxdeploy\n' '620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff' | sha256sum -c -
            printf '%s  /tmp/appimagetool\n' 'f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158' | sha256sum -c -
          fi
          chmod +x /tmp/linuxdeploy /tmp/appimagetool
          mkdir -p AppDir/usr/bin AppDir/usr/bin/data
          cp build/bin/mnemo-go AppDir/usr/bin/mnemo
          cp -a build/bin/data/. AppDir/usr/bin/data/
          cat > AppDir/mnemo.desktop <<EOF
          [Desktop Entry]
          Name=Mnemo
          Exec=mnemo
          Icon=mnemo
          Type=Application
          Categories=Utility;
          EOF
          cp frontend/src/assets/icon.svg AppDir/mnemo.svg
          cat > AppDir/AppRun <<EOF
          #!/bin/sh
          exec \$APPDIR/usr/bin/mnemo \$@
          EOF
          chmod +x AppDir/AppRun
          APPIMAGE_EXTRACT_AND_RUN=1 DEPLOY_GTK_VERSION=3 /tmp/linuxdeploy --appdir AppDir --desktop-file AppDir/mnemo.desktop --icon-file AppDir/mnemo.svg
          APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool AppDir "${{ matrix.artifact }}.AppImage"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.ref_name }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.deb
            ${{ matrix.artifact }}.rpm
            ${{ matrix.artifact }}.AppImage
            build/installer/${{ matrix.artifact }}-Setup.exe
          if-no-files-found: warn

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Mnemo-*-${{ github.ref_name }}
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  release-assets/#  #' > release-assets/SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          release_doc="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "${release_doc}" ]]; then
            cp "${release_doc}" release-notes.md
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" \
              --jq .body > release-notes.md
          fi

          is_prerelease='false'
          if [[ "${GITHUB_REF_NAME}" == *preview* || "${GITHUB_REF_NAME}" == *beta* || "${GITHUB_REF_NAME}" == *rc* || "${GITHUB_REF_NAME}" == *alpha* ]]; then
            is_prerelease='true'
          fi

          if ! gh release view "${tag}" >/dev/null 2>&1; then
            if [[ "${is_prerelease}" == 'true' ]]; then
              gh release create "${tag}" --verify-tag --title="Mnemo ${tag}" --notes-file=release-notes.md --prerelease
            else
              gh release create "${tag}" --verify-tag --title="Mnemo ${tag}" --notes-file=release-notes.md --latest
            fi
          else
            release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .id)
            if [[ "${is_prerelease}" == 'true' ]]; then make_latest='false'; else make_latest='true'; fi
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f name="Mnemo ${tag}" \
              -F body=@release-notes.md \
              -f draft=false \
              -f prerelease="${is_prerelease}" \
              -f make_latest="${make_latest}" >/dev/null
          fi

          find release-assets -maxdepth 1 -type f -print0 \
            | xargs -0 gh release upload "${tag}" --clobber
