# Mnemo Release
# Builds native packages for Windows, Linux and Apple Silicon macOS.

name: Release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.2'
  GOTOOLCHAIN: local
  NODE_VERSION: '24.22.0'

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=webkit2_41
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify release version consistency
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(sed -nE 's/^const AppVersion = "([^"]+)"/\1/p' internal/config/config.go)"
          wails_version="$(node -p "require('./wails.json').version")"
          product_version="$(node -p "require('./wails.json').info.productVersion")"
          frontend_version="$(node -p "require('./frontend/package.json').version")"
          lock_version="$(node -p "require('./frontend/package-lock.json').version")"
          lock_root_version="$(node -p "require('./frontend/package-lock.json').packages[''].version")"
          installer_version="$(sed -nE 's/^[[:space:]]*#define MyAppVersion "([^"]+)"/\1/p' build/windows/installer.iss)"
          test -n "$app_version"
          test "$app_version" = "$wails_version"
          test "$app_version" = "$product_version"
          test "$app_version" = "$frontend_version"
          test "$app_version" = "$lock_version"
          test "$app_version" = "$lock_root_version"
          test "$app_version" = "$installer_version"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            test "v$app_version" = "${GITHUB_REF_NAME}"
            test -f "docs/releases/${GITHUB_REF_NAME}.md"
          fi

      - name: Verify dependency sources and policy tests
        run: |
          node --test tools/supply-chain.test.cjs
          node tools/supply-chain.cjs check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Audit Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build frontend for Go embed
        working-directory: frontend
        run: npm run build

      - name: Run Go tests
        run: go test ./...

      - name: Run Go race tests
        run: go test -race ./...

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Run Go vet
        run: go vet ./...

      - name: Build backend
        run: go build ./...

      - name: Generate dependency and license archive
        shell: bash
        run: |
          set -euo pipefail
          go mod download all
          node tools/supply-chain.cjs collect "$RUNNER_TEMP/mnemo-compliance"
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 mod -licenses -json -output "$RUNNER_TEMP/mnemo-compliance/sbom-go.cdx.json"
          (cd frontend && npm sbom --sbom-format=cyclonedx --package-lock-only --omit=dev > "$RUNNER_TEMP/mnemo-compliance/sbom-frontend.cdx.json")
          git diff --exit-code -- go.mod go.sum frontend/package.json frontend/package-lock.json
          tar -czf "$RUNNER_TEMP/Mnemo-compliance.tar.gz" -C "$RUNNER_TEMP/mnemo-compliance" .

      - name: Upload dependency and license archive
        uses: actions/upload-artifact@v4
        with:
          name: Mnemo-compliance-${{ github.sha }}
          path: ${{ runner.temp }}/Mnemo-compliance.tar.gz
          if-no-files-found: error

  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    name: ${{ matrix.name }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows/amd64
            artifact: Mnemo-windows-x64
            kind: windows
          - name: Windows arm64
            os: windows-latest
            platform: windows/arm64
            artifact: Mnemo-windows-arm64
            kind: windows
          - name: Linux x64
            os: ubuntu-latest
            platform: linux/amd64
            artifact: Mnemo-linux-x64
            kind: linux
          - name: Linux arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: Mnemo-linux-arm64
            kind: linux
          - name: macOS arm64
            os: macos-14
            platform: darwin/arm64
            artifact: Mnemo-macos-arm64
            kind: macos

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Read package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./wails.json').version")"
          echo "MNEMO_PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Install Linux build deps
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev rpm squashfs-tools zstd
          pkg-config --modversion webkit2gtk-4.1
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Build native application
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.kind }}" == 'linux' ]]; then
            wails build -platform "${{ matrix.platform }}" -clean -tags webkit2_41
          else
            wails build -platform "${{ matrix.platform }}" -clean
          fi

      - name: Download dependency and license archive
        uses: actions/download-artifact@v4
        with:
          name: Mnemo-compliance-${{ github.sha }}
          path: build/compliance-archive

      - name: Unpack dependency and license archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/compliance
          tar -xzf build/compliance-archive/Mnemo-compliance.tar.gz -C build/compliance
          test -s build/compliance/LICENSE
          test -s build/compliance/dependency-inventory.json
          test -s build/compliance/THIRD_PARTY_NOTICES.txt

      - name: Package Windows installer
        if: matrix.kind == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          choco install innosetup -y --no-progress
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          # MSYS_NO_PATHCONV=1 防止 Git Bash 把 /D 参数误转为 Windows 路径
          MSYS_NO_PATHCONV=1 "$ISCC" "/DMyArchSuffix=${{ matrix.artifact }}" "/DMyAppVersion=${MNEMO_PACKAGE_VERSION}" build/windows/installer.iss
          test -f "build/installer/${{ matrix.artifact }}-Setup.exe"
          # 拷到根目录再上传，保证 artifact 解包后文件位于顶层（publish 按 maxdepth 1 收集）
          cp "build/installer/${{ matrix.artifact }}-Setup.exe" "${{ matrix.artifact }}-Setup.exe"

      - name: Package Linux installers and archive
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          binary="build/bin/Mnemo"
          test -x "$binary"
          package_stage="$(mktemp -d)"
          archive_stage="$(mktemp -d)"
          appdir="$(mktemp -d)"
          tool_dir="$(mktemp -d)"
          trap 'rm -rf "$package_stage" "$archive_stage" "$appdir" "$tool_dir"' EXIT
          package_arch="amd64"
          appimage_arch="x86_64"
          appimage_sha256="95cbe7cce9717fce90c484e34052ee7c7f1d7635b33c12525b4776826a7d29b6"
          if [[ "${{ matrix.platform }}" == 'linux/arm64' ]]; then
            package_arch="arm64"
            appimage_arch="aarch64"
            appimage_sha256="a595ea34cd6136c7f595e9dcbb16f3e9725d7610efb9e43b38c3c6e86cafc270"
          fi

          mkdir -p "$package_stage/data" "$archive_stage/data"
          cp -a "$binary" "$package_stage/Mnemo"
          cp -a "$binary" "$archive_stage/Mnemo"
          cp -a build/compliance "$package_stage/licenses"
          cp -a build/compliance "$archive_stage/licenses"
          cp -a build/appicon.png "$package_stage/mnemo.png"
          if [[ -f build/bin/data/secrets.json ]]; then
            cp -a build/bin/data/secrets.json "$package_stage/data/secrets.json"
            cp -a build/bin/data/secrets.json "$archive_stage/data/secrets.json"
          fi
          cat > "$package_stage/mnemo.desktop" <<'EOF'
          [Desktop Entry]
          Name=Mnemo
          Exec=/usr/lib/mnemo/Mnemo
          Icon=mnemo
          Type=Application
          Categories=Utility;FileTransfer;
          Terminal=false
          EOF
          test "$(grep -E '^Name=Mnemo$' "$package_stage/mnemo.desktop")" = 'Name=Mnemo'

          export NFPM_ARCH="$package_arch"
          export NFPM_VERSION="${MNEMO_PACKAGE_VERSION}"
          export NFPM_BINARY_PATH="$package_stage/Mnemo"
          export NFPM_DATA_DIR="$package_stage/data"
          export NFPM_DESKTOP_PATH="$package_stage/mnemo.desktop"
          export NFPM_ICON_PATH="$package_stage/mnemo.png"
          export NFPM_LICENSE_DIR="$package_stage/licenses"
          nfpm package --config build/linux/nfpm.yaml --packager deb --target "${{ matrix.artifact }}.deb"
          nfpm package --config build/linux/nfpm.yaml --packager rpm --target "${{ matrix.artifact }}.rpm"
          nfpm package --config build/linux/nfpm.yaml --packager archlinux --target "${{ matrix.artifact }}.pkg.tar.zst"
          dpkg-deb --info "${{ matrix.artifact }}.deb"
          rpm -qip "${{ matrix.artifact }}.rpm"
          tar --zstd -tf "${{ matrix.artifact }}.pkg.tar.zst" >/dev/null

          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/icons/hicolor/256x256/apps"
          cp -a "$binary" "$appdir/usr/bin/Mnemo"
          mkdir -p "$appdir/usr/share/doc/mnemo"
          cp -a build/compliance/. "$appdir/usr/share/doc/mnemo/"
          cp -a build/appicon.png "$appdir/mnemo.png"
          cp -a build/appicon.png "$appdir/usr/share/icons/hicolor/256x256/apps/mnemo.png"
          if [[ -f build/bin/data/secrets.json ]]; then
            mkdir -p "$appdir/usr/bin/data"
            cp -a build/bin/data/secrets.json "$appdir/usr/bin/data/secrets.json"
          fi
          cat > "$appdir/mnemo.desktop" <<'EOF'
          [Desktop Entry]
          Name=Mnemo
          Exec=Mnemo
          Icon=mnemo
          Type=Application
          Categories=Utility;FileTransfer;
          Terminal=false
          EOF
          test "$(grep -E '^Name=Mnemo$' "$appdir/mnemo.desktop")" = 'Name=Mnemo'
          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          APPDIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$APPDIR/usr/bin/Mnemo" "$@"
          EOF
          chmod 0755 "$appdir/AppRun"
          appimage_tool="$tool_dir/appimagetool-${appimage_arch}.AppImage"
          curl --fail --location --retry 3 --retry-delay 2 --output "$appimage_tool" "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${appimage_arch}.AppImage"
          printf '%s  %s\n' "$appimage_sha256" "$appimage_tool" | sha256sum --check
          chmod 0755 "$appimage_tool"
          (
            cd "$tool_dir"
            "$appimage_tool" --appimage-extract >/dev/null
            ARCH="$appimage_arch" ./squashfs-root/AppRun --no-appstream "$appdir" "$GITHUB_WORKSPACE/${{ matrix.artifact }}.AppImage"
          )
          test -s "${{ matrix.artifact }}.AppImage"

          tar -czf "${{ matrix.artifact }}.tar.gz" -C "$archive_stage" .

      - name: Package macOS installer and archive
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          test -d build/bin/Mnemo.app
          mkdir -p build/bin/Mnemo.app/Contents/Resources/licenses
          cp -a build/compliance/. build/bin/Mnemo.app/Contents/Resources/licenses/
          hdiutil create -volname Mnemo -srcfolder build/bin/Mnemo.app -ov -format UDZO "${{ matrix.artifact }}.dmg"
          tar -czf "${{ matrix.artifact }}.tar.gz" -C build/bin Mnemo.app

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: |
            ${{ matrix.artifact }}.deb
            ${{ matrix.artifact }}.rpm
            ${{ matrix.artifact }}.pkg.tar.zst
            ${{ matrix.artifact }}.AppImage
            ${{ matrix.artifact }}.dmg
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}-Setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Mnemo-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          expected_assets=(
            Mnemo-windows-x64-Setup.exe
            Mnemo-windows-arm64-Setup.exe
            Mnemo-linux-x64.deb
            Mnemo-linux-x64.rpm
            Mnemo-linux-x64.pkg.tar.zst
            Mnemo-linux-x64.AppImage
            Mnemo-linux-x64.tar.gz
            Mnemo-linux-arm64.deb
            Mnemo-linux-arm64.rpm
            Mnemo-linux-arm64.pkg.tar.zst
            Mnemo-linux-arm64.AppImage
            Mnemo-linux-arm64.tar.gz
            Mnemo-macos-arm64.dmg
            Mnemo-macos-arm64.tar.gz
            Mnemo-compliance.tar.gz
          )
          for asset in "${expected_assets[@]}"; do
            test -s "release-assets/$asset"
          done
          test "$(find release-assets -maxdepth 1 -type f ! -name SHA256SUMS.txt | wc -l)" -eq "${#expected_assets[@]}"
          find release-assets -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum | sed 's#  release-assets/#  #' > release-assets/SHA256SUMS.txt
          (cd release-assets && sha256sum --check SHA256SUMS.txt)

      - name: Attest release artifacts and checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: '${{ github.workspace }}/release-assets/*'

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # 发版说明优先取 docs/releases/<tag>.md，缺失时退国内联文本（--notes-file 只接受路径）
          if [[ -f "docs/releases/${tag}.md" ]]; then
            notes_args=(--notes-file "docs/releases/${tag}.md")
          else
            notes_args=(--notes "Mnemo ${tag}")
          fi
          is_pre='false'
          [[ "$tag" == *preview* || "$tag" == *beta* || "$tag" == *rc* || "$tag" == *alpha* ]] && is_pre='true'
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = 'true' || { echo '已公开版本不能覆盖，请创建新版本'; exit 1; }
            gh release edit "$tag" --title="Mnemo $tag" "${notes_args[@]}"
          else
            if [[ "$is_pre" == 'true' ]]; then gh release create "$tag" --verify-tag --draft --title="Mnemo $tag" "${notes_args[@]}" --prerelease
            else gh release create "$tag" --verify-tag --draft --title="Mnemo $tag" "${notes_args[@]}"
            fi
          fi
          find release-assets -maxdepth 1 -type f -print0 | xargs -0 gh release upload "$tag" --clobber
          if [[ "$is_pre" == 'true' ]]; then
            gh release edit "$tag" --draft=false --prerelease --latest=false
          else
            gh release edit "$tag" --draft=false --prerelease=false --latest
          fi
