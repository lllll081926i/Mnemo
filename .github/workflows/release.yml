# Mnemo Release
# Builds native packages for Windows, Linux and Apple Silicon macOS.

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Go tests
        run: go test ./...

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Run Go vet
        run: go vet ./...

      - name: Build backend
        run: go build ./...

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build:
    name: ${{ matrix.name }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows/amd64
            artifact: Mnemo-windows-x64
            kind: windows
          - name: Windows arm64
            os: windows-latest
            platform: windows/arm64
            artifact: Mnemo-windows-arm64
            kind: windows
          - name: Linux x64
            os: ubuntu-latest
            platform: linux/amd64
            artifact: Mnemo-linux-x64
            kind: linux
          - name: Linux arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: Mnemo-linux-arm64
            kind: linux
          - name: macOS arm64
            os: macos-14
            platform: darwin/arm64
            artifact: Mnemo-macos-arm64
            kind: macos

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Linux build deps
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          pkg-config --modversion webkit2gtk-4.1

      - name: Build native application
        shell: bash
        env:
          MNEMO_UPDATE_SIGNING_PUBLIC_KEY: ${{ secrets.MNEMO_UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          ldflags=()
          if [[ -n "${MNEMO_UPDATE_SIGNING_PUBLIC_KEY:-}" ]]; then
            ldflags=(-ldflags "-X mnemo-go/internal/updater.updateSigningPublicKey=${MNEMO_UPDATE_SIGNING_PUBLIC_KEY}")
          fi
          if [[ "${{ matrix.kind }}" == 'linux' ]]; then
            wails build -platform "${{ matrix.platform }}" -clean -tags webkit2_41 "${ldflags[@]}"
          else
            wails build -platform "${{ matrix.platform }}" -clean "${ldflags[@]}"
          fi

      - name: Stage OAuth configuration
        shell: bash
        env:
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${ONEDRIVE_CLIENT_ID}" && -z "${DROPBOX_APP_KEY}" ]]; then
            exit 0
          fi
          case "${{ matrix.kind }}" in
            macos) data_dir="build/bin/Mnemo.app/Contents/MacOS/data" ;;
            *) data_dir="build/bin/data" ;;
          esac
          mkdir -p "$data_dir"
          cat > "$data_dir/secrets.json" <<EOF
          {
            "onedrive_client_id": "${ONEDRIVE_CLIENT_ID}",
            "dropbox_app_key": "${DROPBOX_APP_KEY}"
          }
          EOF

      - name: Package Windows installer
        if: matrix.kind == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          choco install innosetup -y --no-progress
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          # MSYS_NO_PATHCONV=1 防止 Git Bash 把 /D 参数误转为 Windows 路径
          MSYS_NO_PATHCONV=1 "$ISCC" "/DMyArchSuffix=${{ matrix.artifact }}" build/windows/installer.iss
          test -f "build/installer/${{ matrix.artifact }}-Setup.exe"
          # 拷到根目录再上传，保证 artifact 解包后文件位于顶层（publish 按 maxdepth 1 收集）
          cp "build/installer/${{ matrix.artifact }}-Setup.exe" "${{ matrix.artifact }}-Setup.exe"

      - name: Package Linux installer and archive
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          binary="build/bin/Mnemo"
          test -x "$binary"
          root="$(mktemp -d)"
          mkdir -p "$root/DEBIAN" "$root/usr/lib/mnemo" "$root/usr/share/applications"
          cp -a "$binary" "$root/usr/lib/mnemo/Mnemo"
          if [[ -f build/bin/data/secrets.json ]]; then
            mkdir -p "$root/usr/lib/mnemo/data"
            cp -a build/bin/data/secrets.json "$root/usr/lib/mnemo/data/secrets.json"
          fi
          cat > "$root/DEBIAN/control" <<EOF
          Package: mnemo
          Version: ${GITHUB_REF_NAME#v}
          Section: utils
          Priority: optional
          Architecture: ${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          Maintainer: Mnemo
          Description: Mnemo multi-drive file manager
          EOF
          cat > "$root/usr/share/applications/mnemo.desktop" <<'EOF'
          [Desktop Entry]
          Name=Mnemo
          Exec=/usr/lib/mnemo/Mnemo
          Type=Application
          Categories=Utility;FileTransfer;
          Terminal=false
          EOF
          dpkg-deb --build "$root" "${{ matrix.artifact }}.deb"
          staging="$(mktemp -d)"
          cp -a "$binary" "$staging/Mnemo"
          if [[ -f build/bin/data/secrets.json ]]; then
            mkdir -p "$staging/data"
            cp -a build/bin/data/secrets.json "$staging/data/secrets.json"
          fi
          tar -czf "${{ matrix.artifact }}.tar.gz" -C "$staging" .

      - name: Package macOS installer and archive
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          test -d build/bin/Mnemo.app
          hdiutil create -volname Mnemo -srcfolder build/bin/Mnemo.app -ov -format UDZO "${{ matrix.artifact }}.dmg"
          tar -czf "${{ matrix.artifact }}.tar.gz" -C build/bin Mnemo.app

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.ref_name }}
          path: |
            ${{ matrix.artifact }}.deb
            ${{ matrix.artifact }}.dmg
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}-Setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Mnemo-*-${{ github.ref_name }}
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum | sed 's#  release-assets/#  #' > release-assets/SHA256SUMS.txt

      - name: Sign release checksums when signing keys are configured
        env:
          MNEMO_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.MNEMO_UPDATE_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          sig_file="$(mktemp)"
          trap 'rm -f "$key_file" "$sig_file"' EXIT
          if [[ -z "${MNEMO_UPDATE_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "MNEMO_UPDATE_SIGNING_PRIVATE_KEY is not configured; publishing unsigned checksum manifest"
            exit 0
          fi
          printf '%s\n' "$MNEMO_UPDATE_SIGNING_PRIVATE_KEY" > "$key_file"
          openssl pkeyutl -sign -inkey "$key_file" -rawin -in release-assets/SHA256SUMS.txt -out "$sig_file"
          base64 -w0 "$sig_file" > release-assets/SHA256SUMS.txt.sig

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="Mnemo ${tag}"
          if [[ -f "docs/releases/${tag}.md" ]]; then notes="docs/releases/${tag}.md"; fi
          is_pre='false'
          [[ "$tag" == *preview* || "$tag" == *beta* || "$tag" == *rc* || "$tag" == *alpha* ]] && is_pre='true'
          if ! gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$is_pre" == 'true' ]]; then gh release create "$tag" --verify-tag --title="Mnemo $tag" --notes-file="$notes" --prerelease
            else gh release create "$tag" --verify-tag --title="Mnemo $tag" --notes-file="$notes" --latest
            fi
          fi
          find release-assets -maxdepth 1 -type f -print0 | xargs -0 gh release upload "$tag" --clobber
